version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:5173
      - OLLAMA_MODEL=llama3
      - DATABASE_URL=sqlite:///./scribe.db
      - MAX_AUDIO_SIZE_MB=25
    volumes:
      - ./backend/scribe.db:/app/scribe.db
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
